<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Meter - Web Monitor</title>
<script src="{{ url_for('static', filename='plotly.min.js') }}"></script>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0 16px 16px 16px;
    background: #1e1e1e;
    color: #ddd;
  }
  h1 {
    font-size: 1.3em;
    font-weight: 600;
    padding: 12px 0 4px 0;
    margin: 0;
  }
  #stats {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.9em;
    padding: 6px 0 10px 0;
    color: #9cdcfe;
    overflow-wrap: anywhere;
  }
  #stats.stale {
    color: #e06c75;
  }
  #stats2 {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.9em;
    padding: 0 0 10px 0;
    color: #f0b866;
    overflow-wrap: anywhere;
  }
  #stats2:empty {
    display: none;
  }
  #power-chart {
    width: 100%;
    height: 60vh;
  }
  #energy-chart {
    width: 100%;
    height: 45vh;
  }
  #controls {
    padding: 8px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  button {
    background: #2d2d2d;
    color: #ddd;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.9em;
  }
  button:hover {
    background: #3d3d3d;
  }
  #fullscreen-btn {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1000;
    font-size: 1.2em;
    line-height: 1;
    padding: 6px 10px;
  }
  /* In fullscreen, make the page fill the whole screen: charts grow to use
     all the space left over after the (compact) header/controls. */
  body:fullscreen {
    height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  body:fullscreen h1 { display: none; }
  body:fullscreen #power-chart {
    flex: 1 1 0;
    height: auto;
    min-height: 0;
  }
  body:fullscreen #energy-chart {
    flex: 1 1 0;
    height: auto;
    min-height: 0;
  }
  #error-banner {
    display: none;
    background: #5a1e1e;
    color: #ffb3b3;
    padding: 8px 12px;
    border-radius: 4px;
    margin: 8px 0;
    font-family: monospace;
    font-size: 0.9em;
  }
  #tasmota-panel {
    margin: 4px 0 8px 0;
    font-size: 0.9em;
  }
  #tasmota-panel > summary {
    cursor: pointer;
    padding: 4px 0;
    color: #9cdcfe;
    user-select: none;
  }
  #tasmota-manager {
    padding: 8px 0 2px 0;
  }
  #tasmota-add {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  #tasmota-add input {
    background: #2d2d2d;
    color: #ddd;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 0.9em;
  }
  #tasmota-status {
    font-family: monospace;
    font-size: 0.85em;
  }
  #tasmota-status.ok { color: #7ec699; }
  #tasmota-status.err { color: #e06c75; }
  #tasmota-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  #tasmota-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 4px 8px;
  }
  #tasmota-list .dev-ip {
    color: #888;
    font-family: monospace;
    font-size: 0.85em;
  }
  #tasmota-list button {
    padding: 2px 8px;
    font-size: 0.8em;
  }
  /* Smartphone / narrow-screen tweaks */
  @media (max-width: 640px) {
    body { padding: 0 8px 8px 8px; }
    h1 { font-size: 1.1em; padding: 8px 40px 4px 0; }
    #stats, #stats2 { font-size: 0.8em; }
    #power-chart { height: 55vh; }
    #energy-chart { height: 40vh; }
    #controls { gap: 6px; }
    #controls button,
    #controls select {
      padding: 8px 10px;
      font-size: 0.85em;
      flex: 1 1 auto;
    }
    #tasmota-add { flex-direction: column; align-items: stretch; }
    #tasmota-add input { width: 100%; box-sizing: border-box; }
    #fullscreen-btn {
      flex: 0 0 auto;
      padding: 8px 12px;
    }
  }
</style>
</head>
<body>
  <h1>Smart Meter - Live Power Monitor (Web)</h1>
  <button id="fullscreen-btn" title="Vollbild ein/aus" aria-label="Vollbild">⛶</button>
  <div id="stats">Loading...</div>
  <div id="stats2"></div>
  <div id="error-banner"></div>
  <div id="controls">
    <button id="reset-view-btn">Ansicht zurücksetzen</button>
    <button id="archive-btn">Messung archivieren &amp; neu starten</button>
    <label for="archive-select" style="margin-left:12px;">Ansicht:</label>
    <select id="archive-select">
      <option value="">Live</option>
    </select>
    <button id="archive-reload-btn">Liste aktualisieren</button>
    <span id="archive-status"></span>
  </div>
  <details id="tasmota-panel">
    <summary>Tasmota-Geräte verwalten</summary>
    <div id="tasmota-manager">
      <div id="tasmota-add">
        <input type="text" id="tasmota-name" placeholder="Name (z.B. Boiler)" autocomplete="off">
        <input type="text" id="tasmota-ip" placeholder="IP / Hostname (z.B. 192.168.100.3)" autocomplete="off">
        <button id="tasmota-add-btn">Hinzufügen</button>
        <span id="tasmota-status"></span>
      </div>
      <ul id="tasmota-list"></ul>
    </div>
  </details>
  <div id="power-chart"></div>
  <div id="energy-chart"></div>

  <script>
    const REFRESH_MS = {{ refresh_ms }};
    const LABEL1 = {{ label1 | tojson }};
    const LABEL2 = {{ label2 | tojson }};

    const powerDiv = document.getElementById('power-chart');
    const energyDiv = document.getElementById('energy-chart');
    const statsDiv = document.getElementById('stats');
    const stats2Div = document.getElementById('stats2');
    const errorBanner = document.getElementById('error-banner');

    // Fixed trace indices for the FIRST smart-meter power lines. The optional
    // second meter (if present) occupies the next three slots, and Tasmota
    // device traces are appended after that and tracked in this map.
    const POWER_TRACE_NET = 0, POWER_TRACE_IN = 1, POWER_TRACE_OUT = 2;
    let meter2Base = -1;          // base trace index of the 2nd meter, -1 = absent
    const tasmotaTraceIndex = {}; // deviceName -> trace index in powerDiv

    let powerInitialized = false;
    let energyInitialized = false;

    // Layout for the right-hand Tasmota axis. Only added when at least one
    // Tasmota device is actually present, so the chart works fine without any
    // Tasmota smart plug (no empty "Tasmota (W)" axis is shown).
    function tasmotaAxisLayout() {
      return {
        title: 'Tasmota (W)', overlaying: 'y', side: 'right',
        showgrid: false, rangemode: 'tozero',
      };
    }

    function basePowerLayout(hasTasmota) {
      const layout = {
        paper_bgcolor: '#1e1e1e',
        plot_bgcolor: '#1e1e1e',
        font: { color: '#ddd' },
        margin: { t: 20, r: 20, l: 60, b: 40 },
        xaxis: { type: 'date', gridcolor: '#333' },
        yaxis: { title: 'Verbrauch / Einspeisung (W)', gridcolor: '#333', rangemode: 'tozero' },
        hovermode: 'closest',
        legend: { orientation: 'h', y: 1.12 },
        shapes: [{
          type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 0, y1: 0,
          line: { color: '#888', dash: 'dash', width: 1 }
        }],
      };
      if (hasTasmota) {
        layout.yaxis2 = tasmotaAxisLayout();
      }
      return layout;
    }

    function baseEnergyLayout() {
      return {
        paper_bgcolor: '#1e1e1e',
        plot_bgcolor: '#1e1e1e',
        font: { color: '#ddd' },
        margin: { t: 10, r: 20, l: 60, b: 60 },
        xaxis: {
          type: 'date', gridcolor: '#333',
          rangeslider: { visible: true, bgcolor: '#2a2a2a' },
        },
        yaxis: { title: 'Energie / 15min (kWh)', gridcolor: '#333',
                 zeroline: true, zerolinecolor: '#888', zerolinewidth: 1 },
        barmode: 'group',
        legend: { orientation: 'h', y: 1.15 },
      };
    }

    function hoverTemplate(unit) {
      return '%{fullData.name}<br>%{x|%H:%M:%S}<br>%{y:.1f} ' + unit + '<extra></extra>';
    }

    // Trace configs (net/in/out) for the optional second meter. Dashed lines
    // and a distinct color palette keep it visually separate from meter 1.
    function meter2Traces(data) {
      return [
        { x: data.power2.net.x, y: data.power2.net.y, name: LABEL2 + ' Net',
          visible: false,
          mode: 'lines', line: { color: '#f59e0b', width: 2, dash: 'dot' },
          hovertemplate: hoverTemplate('W') },
        { x: data.power2.in.x, y: data.power2.in.y, name: LABEL2 + ' In',
          visible: false,
          mode: 'lines', line: { color: '#d946ef', width: 1.5, dash: 'dot' },
          hovertemplate: hoverTemplate('W') },
        { x: data.power2.out.x, y: data.power2.out.y, name: LABEL2,
          mode: 'lines', line: { color: '#14b8a6', width: 3, dash: 'dot' },
          hovertemplate: hoverTemplate('W') },
      ];
    }

    function renderPower(data) {
      const traces = [
        { x: data.power.net.x, y: data.power.net.y, name: LABEL1 + ' Net',
          visible: false,
          mode: 'lines', line: { color: '#3b82f6', width: 2 },
          hovertemplate: hoverTemplate('W') },
        { x: data.power.in.x, y: data.power.in.y, name: 'Verbrauch',
          mode: 'lines', line: { color: '#ef4444', width: 3 },
          hovertemplate: hoverTemplate('W') },
        { x: data.power.out.x, y: data.power.out.y, name: LABEL1 + ' Out',
          visible: false,
          mode: 'lines', line: { color: '#22c55e', width: 1.5 },
          hovertemplate: hoverTemplate('W') },
      ];

      const deviceNames = Object.keys(data.tasmota || {});

      if (!powerInitialized) {
        // Insert the second meter's traces (if present) right after meter 1,
        // so Tasmota traces keep coming after both meters.
        if (data.power2) {
          meter2Base = traces.length;
          meter2Traces(data).forEach((t) => traces.push(t));
        }
        deviceNames.forEach((name) => {
          const series = data.tasmota[name];
          const color = (data.tasmota_colors || {})[name] || '#a855f7';
          tasmotaTraceIndex[name] = traces.length;
          traces.push({
            x: series.x, y: series.y, name: name, yaxis: 'y2',
            mode: 'lines', line: { color: color, width: 1.5 },
            hovertemplate: hoverTemplate('W'),
          });
        });

        const layout = basePowerLayout(deviceNames.length > 0);
        // Leave the x-axis on autorange so a page reload shows the same view as
        // the "Reset view" button (the full loaded history).
        Plotly.newPlot(powerDiv, traces, layout, { responsive: true, scrollZoom: true });
        powerInitialized = true;
        return;
      }

      // Subsequent updates: only touch trace data, never layout, so the
      // user's current zoom/pan state (if any) is preserved.
      const updateX = [data.power.net.x, data.power.in.x, data.power.out.x];
      const updateY = [data.power.net.y, data.power.in.y, data.power.out.y];
      const indices = [POWER_TRACE_NET, POWER_TRACE_IN, POWER_TRACE_OUT];

      // Second meter updates (if present). If it only appeared after the
      // initial plot (reader started late), append its traces now.
      if (data.power2) {
        if (meter2Base < 0) {
          meter2Base = powerDiv.data.length;
          Plotly.addTraces(powerDiv, meter2Traces(data));
        }
        updateX.push(data.power2.net.x, data.power2.in.x, data.power2.out.x);
        updateY.push(data.power2.net.y, data.power2.in.y, data.power2.out.y);
        indices.push(meter2Base, meter2Base + 1, meter2Base + 2);
      }

      deviceNames.forEach((name) => {
        const series = data.tasmota[name];
        if (name in tasmotaTraceIndex && tasmotaTraceIndex[name] < powerDiv.data.length) {
          updateX.push(series.x);
          updateY.push(series.y);
          indices.push(tasmotaTraceIndex[name]);
        }
      });

      Plotly.update(powerDiv, { x: updateX, y: updateY }, {}, indices);

      // Add any brand-new devices as new traces (rare - only when a device
      // is first seen). Assign the trace index at add-time so it always matches
      // the real position in powerDiv.data (never the local net/in/out array).
      deviceNames.forEach((name) => {
        if (!(name in tasmotaTraceIndex)) {
          const series = data.tasmota[name];
          const color = (data.tasmota_colors || {})[name] || '#a855f7';
          // Ensure the right-hand Tasmota axis exists before attaching a trace
          // to it (it is omitted from the initial layout when no device was
          // present at first render).
          if (!powerDiv.layout || !powerDiv.layout.yaxis2) {
            Plotly.relayout(powerDiv, { yaxis2: tasmotaAxisLayout() });
          }
          tasmotaTraceIndex[name] = powerDiv.data.length;
          Plotly.addTraces(powerDiv, {
            x: series.x, y: series.y, name: name, yaxis: 'y2',
            mode: 'lines', line: { color: color, width: 1.5 },
            hovertemplate: hoverTemplate('W'),
          });
        }
      });
    }

    function renderEnergy(data) {
      // Energy In comes from meter 1 (consumption / "Bezug"), plotted upwards.
      // Energy Out (feed-in / "Einspeisung") comes from meter 2 if present -
      // on this setup meter 1 is a pure consumption meter (out == 0) and the
      // feed-in is measured by the second meter. Falls back to meter 1's own
      // out column if there is no second meter. Out is plotted downwards
      // (negative) so both directions are clearly separated.
      const e = data.energy;          // meter 1 (Bezug)
      const e2 = data.energy2;        // meter 2 (Einspeisung), optional
      const outSrc = e2 || e;

      const inX = e.x, inY = e.energy_in_kwh;
      const outX = outSrc.x;
      const outY = outSrc.energy_out_kwh;   // always positive

      const inName = 'Verbrauch';
      const outName = 'Einspeisung';
      const kwhHover =
        '%{fullData.name}<br>%{x|%H:%M:%S}<br>%{y:.3f} kWh<extra></extra>';

      const traces = [
        { x: inX, y: inY, name: inName, type: 'bar',
          marker: { color: '#ef4444', opacity: 0.8 },
          hovertemplate: kwhHover },
        { x: outX, y: outY, name: outName, type: 'bar',
          marker: { color: '#22c55e', opacity: 0.8 },
          hovertemplate: kwhHover },
      ];

      if (!energyInitialized) {
        Plotly.newPlot(energyDiv, traces, baseEnergyLayout(), { responsive: true });
        energyInitialized = true;
        return;
      }

      Plotly.update(
        energyDiv,
        { x: [inX, outX], y: [inY, outY] },
        {},
        [0, 1]
      );
    }

    // Attach a native SVG <title> tooltip (device name -> IP) to each Tasmota
    // legend entry, so hovering the legend shows the device's IP address.
    function applyLegendTooltips(ipMap) {
      if (!ipMap || !Object.keys(ipMap).length) return;
      const groups = powerDiv.querySelectorAll('g.legend g.traces');
      groups.forEach((g) => {
        const textEl = g.querySelector('.legendtext');
        if (!textEl) return;
        const name = textEl.textContent;
        if (!(name in ipMap) || !ipMap[name]) return;
        let title = g.querySelector('title');
        if (!title) {
          title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
          g.appendChild(title);
        }
        title.textContent = name + ' – ' + ipMap[name];
        g.style.cursor = 'help';
      });
    }

    function renderStats(stats) {
      statsDiv.classList.remove('stale');
      statsDiv.textContent =
        `Verbrauch  |  ` +
        `Last Update: ${stats.last_update}  |  ` +
        `Current: ${stats.current_power.toFixed(0)} W  |  ` +
        `Avg: ${stats.avg_power.toFixed(0)} W  |  ` +
        `Max: ${stats.max_power.toFixed(0)} W  |  ` +
        `Min: ${stats.min_power.toFixed(0)} W  |  ` +
        `Points: ${stats.points}`;
    }

    function renderStats2(stats) {
      if (!stats) {
        stats2Div.textContent = '';
        return;
      }
      stats2Div.textContent =
        `${LABEL2}  |  ` +
        `Last Update: ${stats.last_update}  |  ` +
        `Current: ${stats.current_power.toFixed(0)} W  |  ` +
        `Avg: ${stats.avg_power.toFixed(0)} W  |  ` +
        `Max: ${stats.max_power.toFixed(0)} W  |  ` +
        `Min: ${stats.min_power.toFixed(0)} W  |  ` +
        `Points: ${stats.points}`;
    }

    async function refresh() {
      try {
        const url = currentArchive ? '/api/data?archive=' + encodeURIComponent(currentArchive) : '/api/data';
        const resp = await fetch(url);
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${resp.status}`);
        }
        const data = await resp.json();
        errorBanner.style.display = 'none';
        renderPower(data);
        renderEnergy(data);
        renderStats(data.stats);
        renderStats2(data.stats2);
        applyLegendTooltips(data.tasmota_ips || {});
      } catch (err) {
        errorBanner.style.display = 'block';
        errorBanner.textContent = 'Fehler beim Laden der Daten: ' + err.message;
        statsDiv.classList.add('stale');
      }
    }

    let currentArchive = '';   // '' = live view

    async function loadArchiveList() {
      const sel = document.getElementById('archive-select');
      try {
        const resp = await fetch('/api/archives');
        const body = await resp.json();
        const prev = sel.value;
        sel.innerHTML = '<option value="">Live</option>';
        (body.archives || []).forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          // 20260913_163152 -> 2026-09-13 16:31:52
          const m = name.match(/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})$/);
          opt.textContent = m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}:${m[6]}` : name;
          sel.appendChild(opt);
        });
        sel.value = prev;
      } catch (err) {
        /* ignore list errors */
      }
    }

    document.getElementById('archive-select').addEventListener('change', (e) => {
      currentArchive = e.target.value;
      const statusEl = document.getElementById('archive-status');
      statusEl.textContent = currentArchive ? ' Archiv-Ansicht (statisch)' : ' Live-Ansicht';
      // Force full chart rebuild so old traces are replaced cleanly.
      powerInitialized = false;
      energyInitialized = false;
      Plotly.purge(powerDiv);
      Plotly.purge(energyDiv);
      refresh();
    });

    document.getElementById('archive-reload-btn').addEventListener('click', loadArchiveList);

    function resetView() {
      if (powerInitialized) {
        const relayout = { 'xaxis.autorange': true, 'yaxis.autorange': true };
        if (powerDiv.layout && powerDiv.layout.yaxis2) {
          relayout['yaxis2.autorange'] = true;
        }
        Plotly.relayout(powerDiv, relayout);
      }
      if (energyInitialized) {
        Plotly.relayout(energyDiv, { 'xaxis.autorange': true, 'yaxis.autorange': true });
      }
    }

    document.getElementById('reset-view-btn').addEventListener('click', resetView);

    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '🗗' : '⛶';
      // Charts need to re-measure after the viewport size changes.
      if (powerInitialized) Plotly.Plots.resize(powerDiv);
      if (energyInitialized) Plotly.Plots.resize(energyDiv);
    });

    document.getElementById('archive-btn').addEventListener('click', async () => {
      const statusEl = document.getElementById('archive-status');
      if (!confirm('Aktuelle Messwerte archivieren und eine neue Messung starten?')) {
        return;
      }
      if (!confirm('Wirklich sicher? Die laufende Messung wird beendet und eine neue Datei begonnen.')) {
        return;
      }
      statusEl.textContent = ' Archiviere ...';
      try {
        const resp = await fetch('/api/archive', { method: 'POST' });
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok || body.status !== 'ok') {
          throw new Error(body.message || `HTTP ${resp.status}`);
        }
        statusEl.textContent = ' Archiviert nach ' + body.archive +
          ' (' + (body.moved || []).join(', ') + ') – neue Messung läuft.';
        loadArchiveList();
        refresh();
      } catch (err) {
        statusEl.textContent = ' Fehler: ' + err.message;
      }
    });

    // --- Tasmota device management ---------------------------------------
    const tasmotaListEl = document.getElementById('tasmota-list');
    const tasmotaNameEl = document.getElementById('tasmota-name');
    const tasmotaIpEl = document.getElementById('tasmota-ip');
    const tasmotaStatusEl = document.getElementById('tasmota-status');

    function setTasmotaStatus(msg, kind) {
      tasmotaStatusEl.textContent = msg || '';
      tasmotaStatusEl.className = kind || '';
    }

    function renderTasmotaList(devices) {
      tasmotaListEl.innerHTML = '';
      (devices || []).forEach(dev => {
        const li = document.createElement('li');
        const label = document.createElement('span');
        label.textContent = dev.name;
        const ip = document.createElement('span');
        ip.className = 'dev-ip';
        ip.textContent = dev.ip;
        const renameBtn = document.createElement('button');
        renameBtn.textContent = 'Umbenennen';
        renameBtn.addEventListener('click', () => renameTasmotaDevice(dev.name));
        const btn = document.createElement('button');
        btn.textContent = 'Entfernen';
        btn.addEventListener('click', () => removeTasmotaDevice(dev.name));
        li.appendChild(label);
        li.appendChild(ip);
        li.appendChild(renameBtn);
        li.appendChild(btn);
        tasmotaListEl.appendChild(li);
      });
    }

    async function loadTasmotaDevices() {
      try {
        const resp = await fetch('/api/tasmota/devices');
        const body = await resp.json();
        renderTasmotaList(body.devices || []);
      } catch (err) {
        /* ignore list errors */
      }
    }

    async function addTasmotaDevice() {
      const name = tasmotaNameEl.value.trim();
      const ip = tasmotaIpEl.value.trim();
      if (!name || !ip) {
        setTasmotaStatus('Name und IP angeben.', 'err');
        return;
      }
      setTasmotaStatus('Prüfe Erreichbarkeit ...', '');
      try {
        const resp = await fetch('/api/tasmota/devices', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, ip }),
        });
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok || body.status !== 'ok') {
          throw new Error(body.message || `HTTP ${resp.status}`);
        }
        setTasmotaStatus(`'${name}' hinzugefügt.`, 'ok');
        tasmotaNameEl.value = '';
        tasmotaIpEl.value = '';
        renderTasmotaList(body.devices || []);
        refresh();
      } catch (err) {
        setTasmotaStatus('Fehler: ' + err.message, 'err');
      }
    }

    async function renameTasmotaDevice(oldName) {
      const newName = (prompt(`Neuer Name für '${oldName}':`, oldName) || '').trim();
      if (!newName || newName === oldName) {
        return;
      }
      try {
        const resp = await fetch('/api/tasmota/devices/' + encodeURIComponent(oldName), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName }),
        });
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok || body.status !== 'ok') {
          throw new Error(body.message || `HTTP ${resp.status}`);
        }
        setTasmotaStatus(`'${oldName}' in '${newName}' umbenannt.`, 'ok');
        renderTasmotaList(body.devices || []);
        refresh();
      } catch (err) {
        setTasmotaStatus('Fehler: ' + err.message, 'err');
      }
    }

    async function removeTasmotaDevice(name) {
      if (!confirm(`Gerät '${name}' entfernen? Es wird nicht mehr abgefragt; bereits ` +
                   `gespeicherte Live-Daten bleiben bis zur nächsten Archivierung erhalten.`)) {
        return;
      }
      try {
        const resp = await fetch('/api/tasmota/devices/' + encodeURIComponent(name), {
          method: 'DELETE',
        });
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok || body.status !== 'ok') {
          throw new Error(body.message || `HTTP ${resp.status}`);
        }
        setTasmotaStatus(`'${name}' entfernt.`, 'ok');
        renderTasmotaList(body.devices || []);
        refresh();
      } catch (err) {
        setTasmotaStatus('Fehler: ' + err.message, 'err');
      }
    }

    document.getElementById('tasmota-add-btn').addEventListener('click', addTasmotaDevice);
    tasmotaIpEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTasmotaDevice(); });

    loadTasmotaDevices();
    loadArchiveList();
    refresh();
    setInterval(() => { if (!currentArchive) refresh(); }, REFRESH_MS);
  </script>
</body>
</html>
